<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedCheck — Internet Speed Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090f;
    --surf: #0d1117;
    --surf2: #141b24;
    --border: rgba(56,139,253,0.12);
    --blue: #3b82f6;
    --green: #06d6a0;
    --amber: #f59e0b;
    --red: #ef4444;
    --text: #e2eaf6;
    --muted: #4d6080;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(59,130,246,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,.025) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  body::after {
    content: '';
    position: fixed; top: -300px; left: 50%; transform: translateX(-50%);
    width: 1000px; height: 600px; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse, rgba(59,130,246,.06) 0%, transparent 70%);
  }

  .page { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* Progress bar */
  #topBar {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 99;
  }
  #topBarFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--green));
    transition: width 0.35s ease;
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 44px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em;
  }
  .logo-icon {
    width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, var(--blue), var(--green));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .logo-accent { color: var(--blue); }
  .live-badge {
    font-family: 'Fira Code', monospace; font-size: .68rem;
    color: var(--green); border: 1px solid rgba(6,214,160,.25);
    background: rgba(6,214,160,.06); padding: 3px 10px; border-radius: 99px;
    letter-spacing: .1em;
  }

  /* Main */
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 52px 20px 40px;
  }

  .eyebrow {
    font-family: 'Fira Code', monospace; font-size: .68rem;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--blue); margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; flex: 1 1 28px; height: 1px;
    background: var(--blue); opacity: .3;
  }
  h1 {
    font-size: clamp(1.9rem, 4.5vw, 3rem); font-weight: 700;
    letter-spacing: -.03em; text-align: center; line-height: 1.1;
    margin-bottom: 10px;
  }
  h1 span { color: var(--blue); }
  .sub {
    font-family: 'Fira Code', monospace; font-size: .85rem;
    color: var(--muted); text-align: center; margin-bottom: 48px;
  }

  /* Gauge */
  .gauge-wrap {
    position: relative; width: 240px; height: 240px; margin-bottom: 28px;
  }
  .gauge-svg { width: 100%; height: 100%; }
  .gauge-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #gaugeVal {
    font-size: 3rem; font-weight: 700; letter-spacing: -.04em; line-height: 1;
    transition: color .3s;
  }
  .gauge-unit {
    font-family: 'Fira Code', monospace; font-size: .7rem;
    color: var(--muted); letter-spacing: .1em; margin-top: 3px;
  }
  #gaugeLabel {
    font-family: 'Fira Code', monospace; font-size: .62rem;
    letter-spacing: .15em; text-transform: uppercase; margin-top: 6px;
    color: var(--blue); transition: color .3s;
  }

  /* Pulse ring */
  @keyframes pulse-ring {
    0%   { transform: scale(.92); opacity: .5; }
    100% { transform: scale(1.1); opacity: 0; }
  }
  #pulseRing {
    display: none;
    position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid rgba(59,130,246,.22);
    animation: pulse-ring 1.6s ease-out infinite;
  }
  #pulseRing.active { display: block; }

  /* Status */
  .status-row {
    display: flex; align-items: center; gap: 7px;
    font-family: 'Fira Code', monospace; font-size: .73rem;
    color: var(--muted); margin-bottom: 30px; min-height: 20px;
  }
  @keyframes blink { 50% { opacity: .15; } }
  #statusDot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted); transition: background .3s;
  }
  #statusDot.active { background: var(--green); animation: blink 1s step-end infinite; }
  #statusDot.done   { background: var(--green); animation: none; }
  #statusDot.error  { background: var(--red); animation: none; }

  /* Button */
  #startBtn {
    cursor: pointer; border: none; outline: none;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff; font-family: 'Space Grotesk', sans-serif;
    font-size: .95rem; font-weight: 700; letter-spacing: .03em;
    padding: 14px 48px; border-radius: 99px;
    transition: transform .15s, box-shadow .15s;
    margin-bottom: 44px;
  }
  #startBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(59,130,246,.35);
  }
  #startBtn:active:not(:disabled) { transform: translateY(0); }
  #startBtn:disabled {
    background: var(--surf2); color: var(--muted);
    cursor: not-allowed; box-shadow: none; transform: none;
  }

  /* Metrics */
  .metrics {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; width: 100%; max-width: 640px; margin-bottom: 20px;
  }
  .card {
    background: var(--surf); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px;
    position: relative; overflow: hidden; transition: border-color .3s;
  }
  .card.lit { border-color: rgba(59,130,246,.3); }
  .card.lit::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
  }
  .card-icon {
    width: 26px; height: 26px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; margin-bottom: 10px;
  }
  .card-lbl {
    font-family: 'Fira Code', monospace; font-size: .62rem;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-bottom: 5px;
  }
  .card-val {
    font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; line-height: 1;
    color: var(--muted);
  }
  .card-val.set { color: var(--text); }
  .card-val .u {
    font-size: .7rem; font-family: 'Fira Code', monospace;
    font-weight: 400; color: var(--muted); margin-left: 2px;
  }
  .mini-bar {
    height: 3px; background: var(--surf2); border-radius: 99px;
    margin-top: 10px; overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%; width: 0%; border-radius: 99px;
    transition: width 0.8s cubic-bezier(.4,0,.2,1);
  }

  /* Info chips */
  .chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; max-width: 640px; width: 100%;
    margin-bottom: 40px;
  }
  .chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--surf); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px;
    font-family: 'Fira Code', monospace; font-size: .67rem;
    color: var(--muted); transition: border-color .3s, color .3s;
  }
  .chip.loaded { color: var(--text); border-color: rgba(56,139,253,.22); }
  .chip-key { color: var(--muted); }

  /* History */
  #histSection { display: none; width: 100%; max-width: 640px; margin-bottom: 40px; }
  .hist-hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .hist-title {
    font-family: 'Fira Code', monospace; font-size: .68rem;
    text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  }
  #clearBtn {
    font-family: 'Fira Code', monospace; font-size: .63rem;
    color: var(--muted); background: none; border: none; cursor: pointer;
    letter-spacing: .06em; transition: color .2s;
  }
  #clearBtn:hover { color: var(--red); }
  #histList { display: flex; flex-direction: column; gap: 7px; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hist-row {
    display: grid; grid-template-columns: 1fr auto auto auto auto;
    align-items: center; gap: 14px;
    background: var(--surf); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px;
    font-family: 'Fira Code', monospace; font-size: .7rem;
    animation: slide-in .25s ease;
  }
  .hist-time { color: var(--muted); }
  .hist-dl   { color: var(--blue);  font-weight: 500; }
  .hist-ul   { color: var(--green); font-weight: 500; }
  .hist-ping { color: var(--amber); font-weight: 500; }
  .hist-grade {
    width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: .6rem; font-weight: 700;
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--border); padding: 18px 44px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Fira Code', monospace; font-size: .65rem; color: var(--muted);
  }
  .footer-links { display: flex; gap: 18px; }
  .footer-links a { color: var(--muted); text-decoration: none; transition: color .2s; }
  .footer-links a:hover { color: var(--blue); }

  @media (max-width: 560px) {
    header, footer { padding: 14px 18px; }
    .metrics { grid-template-columns: 1fr 1fr; }
    .metrics .card:last-child { grid-column: span 2; }
    footer { flex-direction: column; gap: 10px; text-align: center; }
  }
</style>

<body>
<div id="topBar"><div id="topBarFill"></div></div>
<div class="page">

  <header>
    <div class="logo">
      <div class="logo-icon">⚡</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const MAX_DL   = 300;
const MAX_UL   = 150;
const MAX_PING = 200;
const ARC_LEN  = 424; // 75% of circumference for r=90

const DL_TARGETS = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
];

const UL_ENDPOINTS = [
  'https://httpbin.org/post',
  'https://postman-echo.com/post',
];

// ── State ─────────────────────────────────────────────────────────────────────
let running = false;
let history = [];

// ── Helpers ───────────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setProgress(pct) {
  document.getElementById('topBarFill').style.width = pct + '%';
}

function setStatus(msg, state = '') {
  document.getElementById('statusText').textContent = msg;
  const dot = document.getElementById('statusDot');
  dot.className = state ? 'active' : '';
  if (state === 'done')  dot.className = 'done';
  if (state === 'error') dot.className = 'error';
}

function setGauge(pct, valText, label, color) {
  const arc = document.getElementById('gaugeArc');
  const offset = ARC_LEN - ARC_LEN * Math.min(Math.max(pct, 0), 1);
  arc.style.strokeDashoffset = offset;

  document.getElementById('gaugeVal').textContent = valText;
  const lbl = document.getElementById('gaugeLabel');
  lbl.textContent = label;
  if (color) lbl.style.color = color;
}

function setPulse(on) {
  document.getElementById('pulseRing').className = on ? 'active' : '';
}

function setMetric(valId, barId, cardId, display, barPct) {
  const el = document.getElementById(valId);
  el.classList.add('set');
  // Preserve the <span class="u"> unit label
  const u = el.querySelector('.u');
  el.textContent = display;
  if (u) el.appendChild(u);
  document.getElementById(barId).style.width = Math.min(barPct * 100, 100) + '%';
  document.getElementById(cardId).classList.add('lit');
}

function resetMetrics() {
  ['Dl','Ul','Ping'].forEach(k => {
    const el = document.getElementById('val' + k);
    el.classList.remove('set');
    const u = el.querySelector('.u');
    el.textContent = '—';
    if (u) el.appendChild(u);
    document.getElementById('bar' + k).style.width = '0%';
    document.getElementById('card' + k).classList.remove('lit');
  });
}

// ── Network info ───────────────────────────────────────────────────────────────
async function fetchNetInfo() {
  try {
    const r = await fetch('https://ipapi.co/json/');
    const d = await r.json();
    document.getElementById('valIp').textContent  = d.ip || '—';
    document.getElementById('valIsp').textContent = d.org ? d.org.replace(/^AS\d+\s+/, '').slice(0, 24) : '—';
    document.getElementById('valLoc').textContent = d.city ? `${d.city}, ${d.country_code}` : '—';
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    document.getElementById('valConn').textContent = conn ? (conn.effectiveType || conn.type || 'Unknown') : 'Unknown';
    ['chipIp','chipIsp','chipLoc','chipConn'].forEach(id => document.getElementById(id).classList.add('loaded'));
  } catch (_) {
    document.getElementById('valIp').textContent = 'Unavailable';
  }
}

// ── Ping ───────────────────────────────────────────────────────────────────────
async function measurePing(onSample) {
  const samples = [];
  for (let i = 0; i < 8; i++) {
    const url = `https://www.cloudflare.com/favicon.ico?_=${Date.now()}${i}`;
    const t0 = performance.now();
    try { await fetch(url, { mode: 'no-cors', cache: 'no-store' }); } catch (_) {}
    const ms = performance.now() - t0;
    samples.push(ms);
    onSample(Math.round(ms));
    await sleep(80);
  }
  samples.sort((a, b) => a - b);
  const trimmed = samples.slice(1, -1); // drop min + max
  return Math.round(trimmed.reduce((s, v) => s + v, 0) / trimmed.length);
}

// ── Download ───────────────────────────────────────────────────────────────────
async function measureDownload(onProgress) {
  const results = [];
  for (let i = 0; i < DL_TARGETS.length; i++) {
    const url = DL_TARGETS[i] + '?nc=' + Date.now();
    const t0 = performance.now();
    try {
      const r   = await fetch(url, { cache: 'no-store' });
      const buf = await r.arrayBuffer();
      const elapsed = (performance.now() - t0) / 1000;
      const mbps = (buf.byteLength * 8) / elapsed / 1_000_000;
      results.push(mbps);
    } catch (_) { /* skip */ }
    onProgress((i + 1) / DL_TARGETS.length);
  }
  if (results.length === 0) throw new Error('Download test failed');
  results.sort((a, b) => b - a);
  const top = results.slice(0, Math.ceil(results.length / 2));
  return Math.round(top.reduce((s, v) => s + v, 0) / top.length * 10) / 10;
}

// ── Upload ─────────────────────────────────────────────────────────────────────
async function measureUpload(onProgress) {
  const SIZES = [200_000, 500_000];
  const results = [];
  for (let i = 0; i < SIZES.length; i++) {
    const blob = new Blob([new Uint8Array(SIZES[i]).fill(0x41)]);
    const t0 = performance.now();
    try {
      const r = await fetch(UL_ENDPOINTS[i % UL_ENDPOINTS.length], {
        method: 'POST', body: blob,
        headers: { 'Content-Type': 'application/octet-stream' }
      });
      if (!r.ok) throw new Error('non-2xx');
      const elapsed = Math.max((performance.now() - t0) / 1000 - 0.05, 0.05);
      results.push((SIZES[i] * 8) / elapsed / 1_000_000);
    } catch (_) { results.push(null); }
    onProgress((i + 1) / SIZES.length);
  }
  const valid = results.filter(Boolean);
  if (valid.length === 0) return null;
  return Math.round(valid.reduce((s, v) => s + v, 0) / valid.length * 10) / 10;
}

// ── Grade ──────────────────────────────────────────────────────────────────────
function getGrade(dl) {
  if (dl >= 100) return 'A';
  if (dl >= 50)  return 'B';
  if (dl >= 15)  return 'C';
  return 'D';
}
function gradeColor(g) {
  return { A: '#06d6a0', B: '#3b82f6', C: '#f59e0b', D: '#ef4444' }[g];
}

// ── History ────────────────────────────────────────────────────────────────────
function addHistory(dl, ul, ping) {
  const entry = {
    time:  new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    dl, ul, ping,
    grade: getGrade(dl),
  };
  history.unshift(entry);
  if (history.length > 8) history.pop();
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('histSection');
  const list    = document.getElementById('histList');
  if (history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = history.map(h => {
    const gc = gradeColor(h.grade);
    return `
    <div class="hist-row">
      <span class="hist-time">${h.time}</span>
      <span class="hist-dl">↓ ${h.dl.toFixed(1)} Mbps</span>
      <span class="hist-ul">↑ ${h.ul !== null ? h.ul.toFixed(1) + ' Mbps' : 'N/A'}</span>
      <span class="hist-ping">${h.ping} ms</span>
      <div class="hist-grade" style="background:${gc}22;color:${gc}">${h.grade}</div>
    </div>`;
  }).join('');
}

function clearHistory() {
  history = [];
  renderHistory();
}

// ── Main test ──────────────────────────────────────────────────────────────────
async function startTest() {
  if (running) return;
  running = true;

  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Testing…';
  setPulse(true);
  resetMetrics();
  setGauge(0, '—', 'Initializing', 'var(--blue)');
  setProgress(5);

  try {
    // Network info (non-blocking)
    setStatus('Fetching network info…', 'active');
    fetchNetInfo();

    // ── Ping ──────────────────────────────────────────────────────────────────
    setStatus('Measuring latency…', 'active');
    setGauge(0, '—', 'Ping', 'var(--amber)');
    setProgress(8);

    const pingMs = await measurePing(sample => {
      const pct = 1 - sample / MAX_PING;
      setGauge(pct, String(sample), 'Ping', 'var(--amber)');
      setProgress(p => Math.min(+p + 3, 30));
    });

    setMetric('valPing', 'barPing', 'cardPing', pingMs, 1 - pingMs / MAX_PING);
    setProgress(35);

    // ── Download ──────────────────────────────────────────────────────────────
    setStatus('Testing download speed…', 'active');
    setGauge(0, '0.0', 'Download', 'var(--blue)');
    setProgress(38);

    const dl = await measureDownload(frac => {
      setProgress(38 + frac * 30);
    });

    setGauge(dl / MAX_DL, dl.toFixed(1), 'Download', 'var(--blue)');
    setMetric('valDl', 'barDl', 'cardDl', dl.toFixed(1), dl / MAX_DL);
    setProgress(70);
    await sleep(400);

    // ── Upload ────────────────────────────────────────────────────────────────
    setStatus('Testing upload speed…', 'active');
    setGauge(0, '0.0', 'Upload', 'var(--green)');
    setProgress(73);

    const ul = await measureUpload(frac => {
      setProgress(73 + frac * 22);
    });

    if (ul !== null) {
      setGauge(ul / MAX_UL, ul.toFixed(1), 'Upload', 'var(--green)');
      setMetric('valUl', 'barUl', 'cardUl', ul.toFixed(1), ul / MAX_UL);
    } else {
      const el = document.getElementById('valUl');
      el.classList.add('set');
      const u = el.querySelector('.u');
      el.textContent = 'N/A';
      if (u) el.appendChild(u);
      document.getElementById('cardUl').classList.add('lit');
    }

    setProgress(100);
    await sleep(500);

    // Done — show download on gauge
    setGauge(dl / MAX_DL, dl.toFixed(1), 'Complete', 'var(--green)');
    setStatus('Test complete!', 'done');
    addHistory(dl, ul, pingMs);
    setTimeout(() => setProgress(0), 2000);

  } catch (err) {
    setStatus('Test failed — check your connection and try again.', 'error');
    setGauge(0, '—', 'Error', 'var(--red)');
    setProgress(0);
  }

  setPulse(false);
  btn.disabled = false;
  btn.textContent = '↺ Test Again';
  running = false;
}

// ── Init ───────────────────────────────────────────────────────────────────────
fetchNetInfo();
</script>
